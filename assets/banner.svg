<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220" role="img" aria-label="Rakib — AI-Native Marketing Operator banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="220" fill="url(#bg)"/>
  <rect width="1280" height="220" fill="url(#grid)"/>

  <!-- decorative blobs -->
  <circle cx="1100" cy="60" r="120" fill="#22D3EE" fill-opacity="0.15"/>
  <circle cx="180" cy="200" r="140" fill="#A78BFA" fill-opacity="0.18"/>

  <!-- eyebrow line -->
  <line x1="48" y1="64" x2="160" y2="64" stroke="url(#accent)" stroke-width="3"/>
  <text x="48" y="56" fill="#A5B4FC" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="3">RAKIB · DHAKA, BD</text>

  <!-- main line -->
  <text x="48" y="118" fill="#FFFFFF" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="46" font-weight="800">AI-Native Marketing Operator</text>
  <text x="48" y="166" fill="#E2E8F0" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="500">9+ years building measurable, accountable, cheaper-to-run growth</text>

  <!-- proof row -->
  <text x="48" y="200" fill="#22D3EE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">$1M+ ad spend · 1K+ n8n automations · 20–50% CAC reductions · 5–30% revenue lifts</text>
</svg>