  <text x="48" y="56" fill="#4338CA" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="3">RAKIB · DHAKA, BD</text>

  <text x="48" y="118" fill="#0F172A" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="46" font-weight="800">AI-Native Marketing Operator</text>
  <text x="48" y="166" fill="#334155" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="500">9+ years building measurable, accountable, cheaper-to-run growth</text>

  <text x="48" y="200" fill="#0369A1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">$1M+ ad spend · 1K+ n8n automations · 20–50% CAC reductions · 5–30% revenue lifts</text>
