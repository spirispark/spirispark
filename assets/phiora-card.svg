<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 140" width="1280" height="140" role="img" aria-label="Currently building PhiOra — self-hosted AI infrastructure for businesses">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="140" fill="url(#bg)" rx="14" ry="14"/>
  <rect width="1280" height="140" fill="url(#grid)" rx="14" ry="14"/>
  <!-- PhiOra logo mark (greek phi shape) -->
  <g transform="translate(48, 30)">
    <circle cx="40" cy="40" r="40" fill="#FFFFFF" fill-opacity="0.10"/>
    <line x1="40" y1="10" x2="40" y2="70" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="40" cy="40" rx="22" ry="14" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  </g>
  <!-- text -->
  <text x="160" y="58" fill="#FFFFFF" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="800">PhiOra</text>
  <text x="160" y="90" fill="#E0E7FF" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="500">Self-hosted AI infrastructure for businesses.</text>
  <!-- right-side badges -->
  <g transform="translate(990, 50)">
    <rect width="240" height="34" rx="17" ry="17" fill="#FFFFFF" fill-opacity="0.10"/>
    <text x="120" y="22" fill="#FFFFFF" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">🏗️ Currently building</text>
  </g>
</svg>