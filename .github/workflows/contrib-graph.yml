name: Generate contribution graph

# Regenerates the GitHub-contribution snake SVG used in README.md every day,
# on manual dispatch, and on every push to main. The output branch is the
# only thing this workflow writes to; the README references the SVG via
# https://raw.githubusercontent.com/spirispark/spirispark/output/...

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  # Merge to main regenerates the contribution graph immediately so the README
  # never shows a missing image while waiting for the first daily cron run.
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}